<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Roster - CareFlow</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/ui-polish-phase1.css}"><link rel="stylesheet" th:href="@{/css/ui-polish-phase3-modules.css}">  <link rel="stylesheet" th:href="@{/css/ui-polish-phase4-controls.css}">
  <link rel="stylesheet" th:href="@{/css/ui-polish-phase7-consistency.css}">
  <link rel="stylesheet" th:href="@{/css/careflow-unified-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/careflow-responsive.css}">
</head>
<body>
<div class="app-container">
<aside th:replace="~{fragments/layout :: sidebar('staff-shifts')}"></aside>
<div class="app-main">
<main class="container cf-staff-shifts-page">
<header class="cf-page-header cf-staff-shifts-header">
<div class="cf-page-title">
<p class="cf-eyebrow">CAREFLOW / STAFF &amp; NURSING</p>
<h1>Duty Roster &amp; Shift Handover</h1>
<p>Schedule shifts and record handover notes.</p>
</div>
<nav class="cf-page-nav"><a class="cf-back-link" th:href="@{/staff/dashboard}">← Staff dashboard</a></nav>
</header>
<p th:if="${successMessage}" th:text="${successMessage}" role="status"></p><p th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p>
<section class="card cf-staff-shift-card"><h2>Schedule shift</h2><form class="cf-staff-shift-form" method="post" th:action="@{/staff/shifts}">
<input name="staffUsername" placeholder="Staff username" maxlength="100" required><input name="staffDisplayName" placeholder="Staff display name" maxlength="120" required><input name="department" placeholder="Department" maxlength="80" required>
<input type="date" name="shiftDate" th:value="${today}" required><input type="time" name="startTime" required><input type="time" name="endTime" required><button>Schedule shift</button></form></section>
<section class="card cf-staff-shift-card"><h2>Today's roster</h2><div class="cf-table-scroll"><table class="cf-data-table"><thead><tr><th>Staff</th><th>Department</th><th>Date</th><th>Shift</th><th>Status</th><th>Handover</th></tr></thead><tbody>
<tr th:each="s : ${shifts}"><td th:text="${s.staffDisplayName + ' (' + s.staffUsername + ')'}"></td><td th:text="${s.department}"></td><td th:text="${s.shiftDate}"></td><td th:text="${s.startTime + ' - ' + s.endTime}"></td><td th:text="${s.status}"></td><td><p th:text="${s.handoverNotes}"></p><form th:if="${s.status != 'HANDED_OVER' and s.status != 'CANCELLED'}" method="post" th:action="@{/staff/shifts/{id}/handover(id=${s.id})}"><textarea name="handoverNotes" maxlength="2000" placeholder="Handover notes" required></textarea><button>Save handover</button></form></td></tr><tr th:if="${#lists.isEmpty(shifts)}"><td colspan="6">No shifts scheduled for today.</td></tr></tbody></table></div></section></main>
</div>
</div>
</body></html>

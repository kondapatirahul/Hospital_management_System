<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Roster - CareFlow</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="container" style="max-width:1250px;margin:32px auto;padding:24px">
        <header><a th:href="@{/staff/dashboard}">← Staff dashboard</a>
            <h1>Duty Roster & Shift Handover</h1>
            <p>Schedule shifts and record handover notes.</p>
        </header>
        <p th:if="${successMessage}" th:text="${successMessage}" role="status"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p>
        <section class="card">
            <h2>Schedule shift</h2>
            <form method="post" th:action="@{/staff/shifts}" style="display:flex;flex-wrap:wrap;gap:12px">
                <input name="staffUsername" placeholder="Staff username" maxlength="100" required><input
                    name="staffDisplayName" placeholder="Staff display name" maxlength="120" required><input
                    name="department" placeholder="Department" maxlength="80" required>
                <input type="date" name="shiftDate" th:value="${today}" required><input type="time" name="startTime"
                    required><input type="time" name="endTime" required><button>Schedule shift</button>
            </form>
        </section>
        <section class="card">
            <h2>Today's roster</h2>
            <div style="overflow-x:auto">
                <table style="width:100%">
                    <thead>
                        <tr>
                            <th>Staff</th>
                            <th>Department</th>
                            <th>Date</th>
                            <th>Shift</th>
                            <th>Status</th>
                            <th>Handover</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${shifts}">
                            <td th:text="${s.staffDisplayName + ' (' + s.staffUsername + ')'}"></td>
                            <td th:text="${s.department}"></td>
                            <td th:text="${s.shiftDate}"></td>
                            <td th:text="${s.startTime + ' - ' + s.endTime}"></td>
                            <td th:text="${s.status}"></td>
                            <td>
                                <p th:text="${s.handoverNotes}"></p>
                                <form th:if="${s.status != 'HANDED_OVER' and s.status != 'CANCELLED'}" method="post"
                                    th:action="@{/staff/shifts/{id}/handover(id=${s.id})}"><textarea
                                        name="handoverNotes" maxlength="2000" placeholder="Handover notes"
                                        required></textarea><button>Save handover</button></form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(shifts)}">
                            <td colspan="6">No shifts scheduled for today.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>

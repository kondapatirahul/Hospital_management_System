<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: htmlHead(${isEdit ? 'Edit Supplier' : 'Register Supplier'})}"></head>
<body>

<div class="app-container">
    <aside th:replace="~{fragments/layout :: sidebar('pharmacy-suppliers')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: navbar(${isEdit ? 'Edit Supplier Record' : 'Register New Vendor / Supplier'}, 'Configure wholesale contact information, drug wholesale license, and commercial terms')}"></header>

        <main class="page-content">
            <div th:replace="~{fragments/alerts :: flashAlerts}"></div>

            <div class="card" style="max-width: 800px; margin: 0 auto;">
                <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 class="card-title" th:text="${isEdit ? 'Edit Supplier: ' + supplierDto.name : 'New Supplier Registration'}">Supplier Details</h3>
                    <a th:href="@{/pharmacy/suppliers}" class="btn btn-outline btn-sm">&larr; Back to Suppliers</a>
                </div>

                <div class="card-body">
                    <form th:action="@{/pharmacy/suppliers/save}" th:object="${supplierDto}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                            <div class="form-group">
                                <label class="form-label" for="supplierCode">Supplier Code</label>
                                <input type="text" id="supplierCode" th:field="*{supplierCode}" class="form-control"
                                       th:readonly="${isEdit}" placeholder="e.g. SUP-001" />
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="name">Company / Vendor Name *</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control"
                                       placeholder="e.g. Apex Pharma Global, MedLife" required />
                                <div class="text-danger" style="font-size:0.8rem; color:var(--danger);" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                        </div>

                        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:20px; margin-bottom:20px;">
                            <div class="form-group">
                                <label class="form-label" for="contactPerson">Key Representative</label>
                                <input type="text" id="contactPerson" th:field="*{contactPerson}" class="form-control"
                                       placeholder="Account Manager / Contact" />
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="phone">Phone Number *</label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                       placeholder="+1 (555) 000-0000" required />
                                <div class="text-danger" style="font-size:0.8rem; color:var(--danger);" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="email">Orders Email</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control"
                                       placeholder="orders@supplier.com" />
                            </div>
                        </div>

                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                            <div class="form-group">
                                <label class="form-label" for="licenseNumber">Drug Wholesale License / FDA ID</label>
                                <input type="text" id="licenseNumber" th:field="*{licenseNumber}" class="form-control"
                                       placeholder="e.g. FDA-IL-98421" />
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="paymentTerms">Payment Terms</label>
                                <select id="paymentTerms" th:field="*{paymentTerms}" class="form-control">
                                    <option value="Net 30">Net 30 Days</option>
                                    <option value="Net 15">Net 15 Days</option>
                                    <option value="Net 60">Net 60 Days</option>
                                    <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                                    <option value="Immediate">Immediate / Advance Payment</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom:20px;">
                            <label class="form-label" for="address">Distribution Warehouse Address</label>
                            <input type="text" id="address" th:field="*{address}" class="form-control"
                                   placeholder="Street, City, State, ZIP code" />
                        </div>

                        <div class="form-group" style="margin-bottom:20px;">
                            <label class="form-label" for="notes">Commercial Notes & Catalog Specialization</label>
                            <textarea id="notes" th:field="*{notes}" class="form-control" rows="2"
                                      placeholder="Delivery SLA, preferred courier, emergency shipping options..."></textarea>
                        </div>

                        <div style="margin-bottom:24px;">
                            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600;">
                                <input type="checkbox" th:field="*{active}" />
                                <span>Active Approved Vendor</span>
                            </label>
                        </div>

                        <div style="display:flex; justify-content:flex-end; gap:12px;">
                            <a th:href="@{/pharmacy/suppliers}" class="btn btn-outline">Cancel</a>
                            <button type="submit" class="btn btn-teal">
                                <span th:text="${isEdit ? 'Save Changes' : 'Register Supplier'}">Submit</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/pharmacy.js}"></script>
</body>
</html>

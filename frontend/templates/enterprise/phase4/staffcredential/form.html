<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Staff credential compliance</title><link rel="stylesheet" th:href="@{/static/css/phase4-operations.css}">  <link rel="stylesheet" th:href="@{/css/ui-polish-phase4-controls.css}">
  <link rel="stylesheet" th:href="@{/css/ui-polish-phase7-consistency.css}">
</head><body><main class="cf4-shell cf4-form-shell"><header class="cf4-header"><div><p class="cf4-eyebrow">CAREFLOW / NEW WORKFLOW</p><h1>Create Staff credential compliance</h1><p>Enter accurate, auditable information. Required fields are marked.</p></div><a class="cf4-button cf4-secondary" th:href="@{/enterprise/phase4/staffcredential}">Back to records</a></header><div class="cf4-alert cf4-error" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="cf4-form cf4-panel" method="post" th:action="@{/enterprise/phase4/staffcredential}" th:object="${record}"><label>Title *<input th:field="*{title}" maxlength="180" required></label><label>Description<textarea th:field="*{description}" maxlength="4000" rows="4"></textarea></label><div class="cf4-grid"><label>Reference code<input th:field="*{referenceCode}" maxlength="100"></label><label>Owner<input th:field="*{owner}" maxlength="160"></label><label>Department<input th:field="*{department}" maxlength="160"></label><label>Counterparty / related party<input th:field="*{counterparty}" maxlength="160"></label><label>Amount<input th:field="*{amount}" type="number" min="0" step="0.01"></label><label>Due date<input th:field="*{dueDate}" type="date"></label><label class="cf4-span">Evidence reference<input th:field="*{evidenceReference}" maxlength="1000"></label></div><div class="cf4-form-actions"><button class="cf4-button" type="submit">Create record</button><a class="cf4-button cf4-secondary" th:href="@{/enterprise/phase4/staffcredential}">Cancel</a></div></form></main><script th:src="@{/static/js/phase4-operations.js}" defer></script></body></html>

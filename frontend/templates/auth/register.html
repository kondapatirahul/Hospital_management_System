<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - CareFlow HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page" style="padding: 40px 16px;">

<div class="auth-card" style="max-width: 680px;">
    <div class="auth-header">
        <div class="logo-badge">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </div>
        <h1>Patient Portal Registration</h1>
        <p>Register online to manage appointments, view prescriptions and medical records</p>
    </div>

    <div class="auth-body">
        <div th:replace="~{fragments/alerts :: flashAlerts}"></div>

        <form th:action="@{/register}" th:object="${registrationDto}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">Full Legal Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Sarah Jenkins" required>
                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="name@domain.com" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">Portal Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Primary Contact Phone</label>
                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="e.g. +1 (555) 000-0000" required>
                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" th:field="*{dateOfBirth}" class="form-control">
                    <div th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="text-danger"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select th:field="*{gender}" class="form-control">
                        <option value="">-- Select Gender --</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Blood Group</label>
                    <select th:field="*{bloodGroup}" class="form-control">
                        <option value="">-- Select Blood Group --</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Residential Address</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="Street Address, City, State, ZIP">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Emergency Contact Name</label>
                    <input type="text" th:field="*{emergencyContactName}" class="form-control" placeholder="e.g. David Jenkins (Spouse)">
                </div>

                <div class="form-group">
                    <label class="form-label">Emergency Contact Phone</label>
                    <input type="tel" th:field="*{emergencyContactPhone}" class="form-control" placeholder="Emergency phone number">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Known Allergies</label>
                    <input type="text" th:field="*{allergies}" class="form-control" placeholder="e.g. Penicillin, Peanuts (or 'None')">
                </div>

                <div class="form-group">
                    <label class="form-label">Pre-existing / Chronic Conditions</label>
                    <input type="text" th:field="*{chronicConditions}" class="form-control" placeholder="e.g. Asthma, Hypertension (or 'None')">
                </div>
            </div>

            <button type="submit" class="btn btn-teal btn-lg" style="width: 100%; margin-top: 10px;">
                Complete Registration & Create Account
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.85rem; color: #64748b;">
            Already have an account?
            <a th:href="@{/login}" style="color: #0284c7; font-weight: 600; text-decoration: none;">
                Sign In to Portal
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>

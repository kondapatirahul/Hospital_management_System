<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - CareFlow HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

<div class="auth-card" style="text-align: center; padding: 40px 30px;">
    <div style="width: 70px; height: 70px; border-radius: 50%; background: #fee2e2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px auto;">
        🚫
    </div>
    <h2 style="font-size: 1.5rem; color: #0f2c59; margin-bottom: 8px;">Access Restricted</h2>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 24px;">
        You do not have authorization to view this clinical or administrative page. Role-based security prevents unauthorized access.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
        <a th:href="@{/}" class="btn btn-primary">Return to Dashboard</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-outline">Sign In with Different Role</button>
        </form>
    </div>
</div>

</body>
</html>
